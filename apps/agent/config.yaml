# ASVA Agent Configuration
# All values configurable here — no secrets in this file.

ollama:
  baseUrl: "http://localhost:11434"
  model: "qwen3:4b"
  timeoutMs: 15000
  maxRetries: 3

bridge:
  host: "localhost"
  port: 7890
  reconnectDelaysMs: [1000, 2000, 5000, 10000, 30000, 60000]

agent:
  tickIntervalMs: 50
  maxReplanAttemptsPerTask: 3

database:
  path: "./data/asva.db"

api:
  port: 3000
  host: "127.0.0.1"

log:
  level: "info"
